<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe v2.0 - Proyek Capstone</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Tic Tac Toe</h1>
        
        <div class="scoreboard" id="scoreboard">
            <div class="score" id="playerXLabel">
                <span class="player-name">Pemain 1 (X)</span> <span id="playerXScore">0</span>
            </div>
            <div class="score" id="playerOLabel">
                <span class="player-name">Pemain 2 (O)</span> <span id="playerOScore">0</span>
            </div>
        </div>

        <h2 class="status-text" id="statusText">Pilih Mode Permainan</h2>
        
        <div class="mode-selection" id="modeSelection">
            <button class="mode-btn" data-mode="pva">Player vs AI</button>
            <button class="mode-btn" data-mode="pvp">Player vs Player</button>
        </div>

        <div class="board-container">
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <div id="winningLine" class="winning-line"></div>
        </div>
        
        <div class="button-container">
            <button id="resetButton">Reset Game</button>
            <button id="resetScoreButton">Reset Skor</button>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
